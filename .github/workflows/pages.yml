name: build public site smoke test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/public.yml'
      - 'config/organisations.yml'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-smoke
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Initialize publication database
        run: prt init-db
      - name: Build publication-gated site
        run: prt build-site
      - name: Confirm private state is absent
        shell: bash
        run: |
          test ! -e site/data/raw
          test ! -e site/tracker.duckdb
          test ! -e site/api/review-queue.json
          echo 'Smoke build passed publication boundary checks.'
