name: validate legacy Android publication handoff

on:
  push:
    branches:
      - android-publish

permissions:
  contents: read

concurrency:
  group: public-records-legacy-validation
  cancel-in-progress: false

jobs:
  verify-legacy-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify publication boundary
        shell: bash
        run: |
          test -d site
          test ! -e site/data/raw
          test ! -e site/tracker.duckdb
          test ! -e site/api/review-queue.json

          if find site -type f \( -name '*.duckdb' -o -name '*.duckdb.wal' \) -print -quit | grep -q .; then
            echo 'Database file found in site/; refusing deployment.'
            exit 1
          fi

          if find site -type f -path '*/data/raw/*' -print -quit | grep -q .; then
            echo 'Raw evidence path found in site/; refusing deployment.'
            exit 1
          fi

          if git ls-files | grep -E '^(data/raw/|data/tracker\.duckdb$)' >/dev/null; then
            echo 'Private collection state is tracked on the publish branch; refusing deployment.'
            exit 1
          fi

          echo 'Publication boundary checks passed.'

      # Legacy phone uploads can be audited but cannot overwrite cloud Pages.
      - name: Upload legacy sanitized site for manual inspection
        uses: actions/upload-artifact@v4
        with:
          name: legacy-android-sanitized-site
          path: site
          retention-days: 7
