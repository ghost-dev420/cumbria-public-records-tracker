name: scheduled collection smoke test

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source id, priority, or all
        required: false
        default: priority
  push:
    branches: [main]
    paths:
      - 'config/**'
      - '.github/workflows/collect-and-publish.yml'
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: public-records-collection-smoke
  cancel-in-progress: true

jobs:
  collect-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tracker
        run: pip install -e .

      - name: Initialize fresh smoke-test database
        run: prt init-db

      - name: Collect public records smoke sample
        env:
          SOURCE_ID: ${{ inputs.source || 'priority' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_ID" == "priority" ]]; then
            sources=(
              cumberland_transparency
              westmorland_furness_spending
              contracts_finder
              find_a_tender
              lgsco_cumberland
              lgsco_westmorland_furness
              housing_ombudsman_home_group
              westmorland_furness_south_lakeland_grants
            )
            for source in "${sources[@]}"; do
              echo "::group::Collect $source"
              prt collect --source "$source" --page-limit 1
              echo "::endgroup::"
            done
          else
            prt collect --source "$SOURCE_ID" --page-limit 1
          fi

      - name: Build publication-gated site
        run: prt build-site

      - name: Confirm raw/private state is not in site
        shell: bash
        run: |
          set -euo pipefail
          test ! -e site/data/raw
          test ! -e site/tracker.duckdb
          test ! -e site/api/review-queue.json
          if find site -type f \( -name '*.duckdb' -o -name '*.duckdb.wal' \) -print -quit | grep -q .; then
            echo 'Private database file found under site/.'
            exit 1
          fi
          if find site -type f -path '*/data/raw/*' -print -quit | grep -q .; then
            echo 'Raw evidence path found under site/.'
            exit 1
          fi
          echo 'Publication boundary checks passed.'

      - name: Upload sanitized smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-records-smoke-site
          path: site
          retention-days: 7
