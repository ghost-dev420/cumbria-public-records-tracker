    organisation_ids:
      - barrow_borough_council
      - eden_district_council
      - south_lakeland_district_council
      - westmorland_furness_council
    extractors: [modern_gov]
    start_urls:
      - https://www.barrowbc.gov.uk/council/financial-services/transparency
      - https://www.eden.gov.uk/council-business/requesting-information/open-data/
