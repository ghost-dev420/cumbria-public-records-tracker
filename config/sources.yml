  - id: contracts_finder
    name: Contracts Finder OCDS notices
    kind: contracts_finder
    enabled: true
    evidence_class: OFFICIAL_RECORD
    organisation_ids:
      - cumberland_council
      - westmorland_furness_council
      - workington_town_council
      - wigton_town_council
      - whitehaven_town_council
      - allerdale_borough_council
      - carlisle_city_council
      - copeland_borough_council
      - barrow_borough_council
      - eden_district_council
      - south_lakeland_district_council
      - cumbria_county_council
    endpoint: https://www.contractsfinder.service.gov.uk/Published/Notices/OCDS/Search
    days_back: 14
    buyer_terms:
      - Cumberland Council
      - Westmorland and Furness Council
      - Workington Town Council
      - Wigton Town Council
      - Whitehaven Town Council
      - Cumbria County Council
      - Allerdale Borough Council
      - Carlisle City Council
      - Copeland Borough Council
      - Barrow Borough Council
      - Eden District Council
      - South Lakeland District Council
      - Home Group
      - Home Group Limited

  - id: lgsco_cumberland
    name: LGSCO decisions concerning Cumberland Council
    kind: html_listing
    enabled: true
    evidence_class: REGULATORY_FINDING
    organisation_ids: [cumberland_council]
    start_urls:
      - https://www.lgo.org.uk/Decisions/SearchResults?aname=Cumberland%20Council&dc=c%2Bnu%2Bu%2B&sortOrder=descending
    include_link_regex: '/decisions/'
    filter_text: 'Cumberland Council'
    page_limit: 5
    max_records: 120
    follow_pagination: true
    pagination_text: 'next'

  - id: lgsco_westmorland_furness
