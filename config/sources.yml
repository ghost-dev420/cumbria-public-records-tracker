  - id: carlisle_current_and_legacy
    name: Carlisle current Charter Trustees and legacy City Council records
    kind: html_listing
    enabled: true
    evidence_class: OFFICIAL_RECORD
    organisation_ids: [carlisle_charter_trustees, carlisle_city_council, cumberland_council]
    extractors: [modern_gov]
    start_urls:
      - https://cumberland.moderngov.co.uk/mgCommitteeDetails.aspx?ID=449
      - https://cumberland.moderngov.co.uk/mgCalendarMonthView.aspx
    include_link_regex: '(ieListDocuments\.aspx|celistdocuments\.aspx|documents/.*\.(?:pdf|docx?|xlsx?|csv))(?:\?.*)?$'
    filter_text: 'Carlisle'
    page_limit: 2
    max_records: 160

  - id: cumberland_legacy_authorities
