      - allerdale_borough_council
      - carlisle_city_council
      - copeland_borough_council
      - cumbria_county_council
      - cumberland_council
    extractors: [modern_gov]
    start_urls:
      - https://cumberland.moderngov.co.uk/mgCalendarMonthView.aspx
