    follow_pagination: true
    pagination_text: 'next'

  - id: housing_ombudsman_home_group
    name: Housing Ombudsman decisions concerning Home Group
    kind: html_listing
    enabled: true
    evidence_class: REGULATORY_FINDING
    start_urls:
      - https://www.housing-ombudsman.org.uk/decisions/
    include_link_regex: '/decisions/home-group-limited-[^/]+/?$'
    filter_text: 'Home Group Limited'
    page_limit: 25
    max_records: 150
    follow_pagination: true
    pagination_text: 'next'
