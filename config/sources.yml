sources:
  - id: cumberland_meetings
    name: Cumberland Council committee calendar and papers
    kind: html_listing
    enabled: true
    evidence_class: OFFICIAL_RECORD
    organisation_ids: [cumberland_council]
    extractors: [modern_gov]
    start_urls:
      - https://cumberland.moderngov.co.uk/mgCalendarMonthView.aspx
    include_link_regex: '(mgMeetingAttendance|ieListDocuments|documents/.*\.(?:pdf|docx?|xlsx?|csv))(?:\?.*)?$'
    page_limit: 4
    max_records: 120
    follow_pagination: true
    pagination_text: 'next'

  - id: cumberland_moderngov_structure
    name: Cumberland Council ModernGov people committees and interests
    kind: modern_gov
    enabled: true
    evidence_class: OFFICIAL_RECORD
    organisation_ids: [cumberland_council, carlisle_charter_trustees]
    extractors: [modern_gov]
    start_urls:
      - https://cumberland.moderngov.co.uk/mgMemberIndex.aspx?PIC=0&VW=LIST
      - https://cumberland.moderngov.co.uk/mgListCommittees.aspx?bcr=1
    page_limit: 300
    max_depth: 3

  - id: cumberland_transparency
    name: Cumberland Council transparency documents
    kind: html_listing
    enabled: true
    evidence_class: OFFICIAL_RECORD
    organisation_ids: [cumberland_council]
    start_urls:
      - https://www.cumberland.gov.uk/document-search?field_document_target_id=1283
    include_link_regex: '\.(?:pdf|docx?|xlsx?|csv)(?:\?.*)?$'
    page_limit: 8
    max_records: 160
    follow_pagination: true
    pagination_text: 'next'

  - id: cumberland_parish_directory
