# Supplemental official public-record sources. Updating this registry triggers the production crawl.
sources:
  - id: find_a_tender
    name: Find a Tender OCDS notices
    kind: find_tender
    enabled: true
    evidence_class: OFFICIAL_RECORD
    extractors: [contracts_finder]
    organisation_ids:
      - cumberland_council
      - westmorland_furness_council
      - workington_town_council
      - wigton_town_council
      - whitehaven_town_council
      - cumbria_county_council
      - allerdale_borough_council
      - carlisle_city_council
      - copeland_borough_council
      - barrow_borough_council
      - eden_district_council
      - south_lakeland_district_council
    endpoint: https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages
    days_back: 30
    stages: [tender, award]
    buyer_terms:
      - Cumberland Council
      - Westmorland and Furness Council
      - Workington Town Council
      - Wigton Town Council
      - Whitehaven Town Council
      - Cumbria County Council
      - Allerdale Borough Council
      - Carlisle City Council
      - Copeland Borough Council
      - Barrow Borough Council
      - Eden District Council
      - South Lakeland District Council
      - Home Group
      - Home Group Limited

  - id: westmorland_furness_south_lakeland_grants
    name: Westmorland and Furness South Lakeland successful community grants
    kind: html_listing
    enabled: true
    evidence_class: OFFICIAL_RECORD
    extractors: [grants]
    organisation_ids: [westmorland_furness_council]
    start_urls:
      - https://www.westmorlandandfurness.gov.uk/your-environment/community-safety-support-assets-and-funding/area-locality-boards-community-development-teams-and-community-funds/south-lakeland-locality-board-and-community-development-team
    include_link_regex: '$^'
    page_limit: 1
    max_records: 1
