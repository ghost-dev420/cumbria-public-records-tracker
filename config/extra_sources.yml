# Supplemental official public-record sources. Updating this registry triggers the production crawl.
sources:
  - id: find_a_tender
    name: Find a Tender OCDS notices
    kind: find_tender
    enabled: true
    evidence_class: OFFICIAL_RECORD
    extractors: [contracts_finder]
    organisation_ids:
      - cumberland_council
      - westmorland_furness_council
      - workington_town_council
